<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#152f4a">
  <title>Painel de avisos · Revista Digital Campo Belo</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 28px 16px; background: #f3f4f7; color: #152f4a; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(100%, 620px); margin: 0 auto; padding: clamp(22px, 5vw, 38px); border: 1px solid #d6dce4; border-radius: 16px; background: white; }
    h1 { margin: 0 0 8px; font: 700 1.8rem/1.15 Georgia, serif; }
    p { margin: 0 0 18px; }
    label { display: block; margin: 15px 0 6px; font-weight: 700; }
    input, textarea { display: block; width: 100%; padding: 11px 12px; border: 1px solid #aab6c3; border-radius: 8px; font: inherit; }
    textarea { min-height: 115px; resize: vertical; }
    button { min-height: 44px; margin: 12px 8px 0 0; padding: 9px 14px; border: 1px solid #173b5d; border-radius: 8px; background: #173b5d; color: white; font: 700 .9rem system-ui, sans-serif; cursor: pointer; }
    button.secondary { background: white; color: #173b5d; }
    button:disabled { opacity: .55; cursor: wait; }
    [role=status] { min-height: 1.5em; margin-top: 16px; font-weight: 650; }
    .hint { color: #526176; font-size: .88rem; }
    :focus-visible { outline: 3px solid #c9a84c; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Painel de avisos</h1>
    <p>Envie uma notificação para as pessoas que ativaram os avisos neste app.</p>
    <label for="adminToken">Chave administrativa</label>
    <input id="adminToken" type="password" autocomplete="off" spellcheck="false">
    <button id="loadCount" class="secondary" type="button">Ver inscritos</button>
    <p id="audience" class="hint"></p>
    <form id="sendForm">
      <label for="pushTitle">Título (até 80 caracteres)</label>
      <input id="pushTitle" maxlength="80" required>
      <label for="pushBody">Mensagem (até 240 caracteres)</label>
      <textarea id="pushBody" maxlength="240" required></textarea>
      <label for="pushUrl">Página ao tocar no aviso</label>
      <input id="pushUrl" value="/" required>
      <button id="sendButton" type="submit">Enviar para todos inscritos</button>
    </form>
    <p id="adminStatus" role="status" aria-live="polite"></p>
    <p class="hint">A chave fica apenas nesta aba e é enviada ao servidor por HTTPS. Não a inclua em links ou mensagens.</p>
  </main>
  <script>
    (() => {
      const tokenInput = document.getElementById('adminToken');
      const countButton = document.getElementById('loadCount');
      const form = document.getElementById('sendForm');
      const sendButton = document.getElementById('sendButton');
      const status = document.getElementById('adminStatus');
      const audience = document.getElementById('audience');
      const token = () => tokenInput.value.trim();
      const request = (path, body) => fetch(path, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token()}` },
        body: JSON.stringify(body)
      });

      countButton.addEventListener('click', async () => {
        countButton.disabled = true;
        try {
          const response = await request('./api/push/admin/count', {});
          const data = await response.json();
          if (!response.ok) throw new Error(data.error || 'Não foi possível consultar os inscritos.');
          audience.textContent = `${data.subscribers} aparelho(s) inscrito(s).`;
          status.textContent = '';
        } catch (error) { status.textContent = error.message; }
        finally { countButton.disabled = false; }
      });

      form.addEventListener('submit', async event => {
        event.preventDefault();
        if (!token()) { status.textContent = 'Informe a chave administrativa.'; tokenInput.focus(); return; }
        if (!confirm('Enviar este aviso para todos os aparelhos inscritos?')) return;
        sendButton.disabled = true;
        status.textContent = 'Enviando…';
        let cursor = '';
        let sent = 0;
        let failed = 0;
        let removed = 0;
        try {
          do {
            const response = await request('./api/push/admin/send', {
              title: document.getElementById('pushTitle').value,
              body: document.getElementById('pushBody').value,
              url: document.getElementById('pushUrl').value,
              cursor
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.error || 'O envio não foi concluído.');
            sent += data.sent;
            failed += data.failed;
            removed += data.removed;
            cursor = data.nextCursor || '';
            status.textContent = `Progresso: ${sent} enviado(s), ${failed} falha(s), ${removed} inscrição(ões) removida(s).`;
            if (data.done) break;
          } while (cursor);
          status.textContent = `Concluído: ${sent} enviado(s), ${failed} falha(s), ${removed} inscrição(ões) removida(s).`;
        } catch (error) { status.textContent = error.message; }
        finally { sendButton.disabled = false; }
      });
    })();
  </script>
</body>
</html>
